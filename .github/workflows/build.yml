{"name":"Build FireQuest","on":{"push":{"branches":["main"],"paths-ignore":[".github/**"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"name":"Unpack the code","run":"Z=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -n 1); if [ -n \"$Z\" ]; then unzip -oq \"$Z\" -d /tmp/code && cp -r /tmp/code/*/. . ; fi; test -f build.sh || { echo 'build.sh missing - the uploaded zip is an old version'; exit 1; }"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Build and publish","run":"bash build.sh","env":{"BUILD_NUMBER":"${{ github.run_number }}","PUBLISH":"1","GH_TOKEN":"${{ github.token }}","SUPABASE_URL":"${{ vars.SUPABASE_URL }}","SUPABASE_KEY":"${{ vars.SUPABASE_PUBLISHABLE_KEY }}","CONTROL_ROOM_PHONE":"${{ vars.CONTROL_ROOM_PHONE }}"}}]}}}
