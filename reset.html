<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F0F10">
<title>FireQuest – new password</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #0F0F10; --surface: #1A1A1C; --border: #2E2C28; --text: #F4F1EA;
    --muted: #A8A39A; --gold: #B99B52; --gold-text: #D9BE7E; --red: #D42F35;
    --green: #7EE2A8; --green-deep: #13261B; --bad: #F2A1A4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  main { max-width: 460px; margin: 0 auto; padding: 36px 16px 40px; }
  .top { text-align: center; }
  img { width: 96px; height: auto; }
  h1 { font-size: 26px; line-height: 1.2; margin: 14px 0 6px; text-align: center; }
  p { color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #CFC9BD; margin: 16px 0 6px; }
  input {
    width: 100%; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 17px;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .show { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 15px; }
  .show input { width: 20px; min-height: 20px; }
  button {
    width: 100%; min-height: 56px; margin-top: 22px; border: 0; border-radius: 16px;
    background: var(--gold); color: #16130D; font-size: 18px; font-weight: 800;
  }
  button:disabled { opacity: .6; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 15px; }
  .msg.bad { background: #2A1213; color: var(--bad); }
  .msg.ok { background: var(--green-deep); color: var(--green); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top"><img src="logo.png" alt="FireQuest"></div>
  <h1>Choose a new password</h1>

  <form id="form" hidden>
    <p>Type your new FireQuest password twice. Use at least 8 characters.</p>
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Type it again</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <label class="show"><input id="showpw" type="checkbox"> Show password</label>
    <button id="save" type="submit">Save new password</button>
  </form>

  <div id="msg" class="msg" hidden></div>
</main>
<script>
(function () {
  var SUPABASE_URL = 'https://pwlgbvzslpidlidhjzeo.supabase.co';
  var KEY = 'sb_publishable_eF7a_6tCE8UmLoPbPMi3RQ_T8zd8U4P'; // public app key (same as in the app)

  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'bad'); msg.hidden = false; }

  var params = new URLSearchParams(location.hash.replace(/^#/, ''));
  var q = new URLSearchParams(location.search);
  var token = params.get('access_token');
  // Remove the secret from the address bar straight away.
  if (location.hash) history.replaceState(null, '', location.pathname);

  var err = params.get('error_description') || q.get('error_description');
  if (err || !token) {
    show((err && /expired|invalid/i.test(err)
      ? 'This link has expired or was already used. '
      : 'This link is not complete. ') +
      'Open the FireQuest app, tap "Forgot password?" and ask for a new email. Use the newest email only.', false);
    return;
  }
  form.hidden = false;

  document.getElementById('showpw').addEventListener('change', function (e) {
    var t = e.target.checked ? 'text' : 'password';
    document.getElementById('p1').type = t;
    document.getElementById('p2').type = t;
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value;
    var p2 = document.getElementById('p2').value;
    if (p1.length < 8) return show('Your password must be at least 8 characters.', false);
    if (p1 !== p2) return show('The two passwords are not the same.', false);
    var btn = document.getElementById('save');
    btn.disabled = true; btn.textContent = 'Saving…'; msg.hidden = true;
    fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + token },
      body: JSON.stringify({ password: p1 })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { return { ok: r.ok, b: b }; });
    }).then(function (res) {
      if (res.ok) {
        form.hidden = true;
        show('Your new password is saved. Open the FireQuest app and sign in with your email and the new password.', true);
        token = null;
      } else {
        var m = (res.b && (res.b.msg || res.b.message || res.b.error_description)) || '';
        show(/same|different/i.test(m) ? 'Choose a password that is different from your old one.'
          : /weak|short|length/i.test(m) ? 'That password is too weak. Use at least 8 characters.'
          : /expired|jwt|token/i.test(m) ? 'This link has expired. In the app, tap "Forgot password?" and ask for a new email.'
          : 'Could not save the password. Please try again.', false);
        btn.disabled = false; btn.textContent = 'Save new password';
      }
    }).catch(function () {
      show('No internet connection. Check your connection and try again.', false);
      btn.disabled = false; btn.textContent = 'Save new password';
    });
  });
})();
</script>
</body>
</html>
