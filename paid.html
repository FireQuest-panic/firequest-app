<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F0F10">
<title>FireQuest payment</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #0F0F10; --surface: #1A1A1C; --border: #2E2C28; --text: #F4F1EA;
    --muted: #A8A39A; --gold: #B99B52; --gold-text: #D9BE7E; --gold-deep: #262014;
    --red: #D42F35; --red-press: #B5242A; --green: #7EE2A8; --green-deep: #13261B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  main { max-width: 460px; margin: 0 auto; padding: 36px 16px 40px; text-align: center; }
  img { width: 110px; height: auto; }
  .icon { width: 64px; height: 64px; margin: 18px auto 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; }
  .icon.ok { background: var(--green-deep); color: var(--green); }
  .icon.info { background: var(--gold-deep); color: var(--gold-text); }
  h1 { font-size: 26px; line-height: 1.2; margin: 14px 0 6px; }
  p { color: var(--muted); margin: 0 0 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; margin: 22px 0 0;
    min-height: 58px; padding: 0 20px; border-radius: 16px; background: var(--red);
    color: #fff; font-size: 19px; font-weight: 700; text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: var(--red-press); }
  .small { font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="FireQuest Search &amp; Rescue">
  <div id="icon" class="icon ok" aria-hidden="true">✓</div>
  <h1 id="title">Thank you</h1>
  <p id="text">PayFast is confirming your payment. It shows in the FireQuest app within a minute.</p>
  <a class="btn" href="intent://billing#Intent;scheme=firequest;package=za.co.firequest.panic;end">Open FireQuest</a>
  <p class="small">If the button does nothing, open the FireQuest app yourself.</p>
</main>
<script>
(function () {
  var result = new URLSearchParams(location.search).get('result');
  var title = document.getElementById('title');
  var text = document.getElementById('text');
  var icon = document.getElementById('icon');
  if (result === 'cancelled') {
    // Tell FireQuest, so the app stops waiting for this payment.
    var id = new URLSearchParams(location.search).get('c') || '';
    if (/^[0-9a-f-]{36}$/i.test(id)) {
      try { fetch('https://pwlgbvzslpidlidhjzeo.supabase.co/functions/v1/payfast/abandon?id=' + encodeURIComponent(id), { method: 'POST' }).catch(function () {}); } catch (e) { /* ignore */ }
    }
    title.textContent = 'Payment cancelled';
    text.textContent = 'Nothing was paid. You can try again any time in the FireQuest app under Account > Subscription.';
    icon.className = 'icon info';
    icon.textContent = '!';
  } else if (result === 'card') {
    title.textContent = 'Card details saved';
    text.textContent = 'Your next monthly FireQuest debit uses the card you just entered.';
  }
})();
</script>
</body>
</html>
